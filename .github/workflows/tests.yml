# .github/workflows/tests.yml
# ----------------------------------------------------------------------------
# Continuous Integration (CI): GitHub runs this automatically on every push
# and pull request, on fresh Linux and Windows machines in the cloud.
# If any test fails, the commit gets a red X; if all pass, a green check.
# ----------------------------------------------------------------------------

name: Tests

# WHEN to run: every push to main, and every pull request.
on:
  push:
    branches: [main]
  pull_request:
  # Also allow starting it by hand from the repo's "Actions" tab.
  workflow_dispatch:

# Security: this workflow only needs to READ the code, so we give it no
# write permissions at all (principle of least privilege).
permissions:
  contents: read

# If you push twice quickly, cancel the older run instead of wasting time on it.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}

    # The matrix runs the job once for EVERY combination below (2 x 2 = 4 runs),
    # proving the compiler works on both Linux and Windows.
    strategy:
      fail-fast: false        # keep running the others even if one fails
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.13"]

    env:
      # No screen exists on CI machines, so charts must not open windows.
      MPLBACKEND: Agg

    steps:
      # 1. Download the repository's code onto the CI machine.
      - name: Check out code
        uses: actions/checkout@v7

      # 2. Install the requested Python version (and cache pip downloads
      #    between runs so later runs are faster).
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # 3. Install our dependencies exactly as a new developer would.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. Run every test with coverage. Fails if any test fails OR if
      #    coverage drops below the fail_under value in .coveragerc.
      - name: Run tests with coverage
        run: pytest -v --cov --cov-report=term-missing --cov-report=xml

      # 5. Smoke test: compile and run the real example programs end to end,
      #    the same commands a user (or your examiner) would type.
      - name: Compile and run examples
        run: |
          python src/main.py examples/analysis.dsl --all
          python src/main.py examples/optimize_demo.dsl --opt
          python src/main.py examples/plot_demo.dsl

      # 6. Save the coverage report so it can be downloaded from the run page.
      #    Only from one matrix job, to avoid four identical copies.
      - name: Upload coverage report
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage.xml
