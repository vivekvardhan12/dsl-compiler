# pytest.ini - configuration for the pytest test runner.
[pytest]
# Look for tests only inside the tests/ folder.
testpaths = tests
# Add src/ to Python's import path so tests can write `from lexer import Lexer`.
pythonpath = src
# Put temporary test files (the tmp_path fixture) in a folder inside the
# project instead of the system Temp folder. On Windows the system folder
# (C:\Users\<you>\AppData\Local\Temp\pytest-of-<you>) can become
# "Access is denied" - e.g. after running pytest from an Administrator
# prompt, or when antivirus locks it. pytest empties this folder at the
# start of every run, so it never grows.
addopts = --basetemp=.pytest_tmp
